---
Connection:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    provider:
      "$ref": "./money.yaml#/Provider"
    externalAccountOwnerId:
      "$ref": "./money.yaml#/ID"
    historyFrom:
      "$ref": "./money.yaml#/Date"
    products:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 2000
    state:
      type: string
      enum:
      - pending
      - connected
      - syncing
      - reauth_required
      - disconnected
      - failed
    quality:
      "$ref": "./quality.yaml#/DataQuality"
    deploymentGate:
      "$ref": "./connections.yaml#/DeploymentGate"
    generation:
      "$ref": "./money.yaml#/Revision"
    lastError:
      "$ref": "./quality.yaml#/APIError"
  required:
  - id
  - revision
  - provider
  - externalAccountOwnerId
  - products
  - state
  - quality
  - generation
  - deploymentGate
ConnectionCreate:
  description: Current implementation supports Raiffeisen entrepreneur current accounts and Alfa current accounts with debit-card aliases; other products return feature_unavailable. historyFrom cannot be after the current Moscow date.
  type: object
  additionalProperties: false
  properties:
    provider:
      "$ref": "./money.yaml#/Provider"
    externalAccountOwnerId:
      "$ref": "./money.yaml#/ID"
    historyFrom:
      "$ref": "./money.yaml#/Date"
    products:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 2000
      minItems: 1
  required:
  - provider
  - externalAccountOwnerId
  - historyFrom
  - products
ConnectionAction:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
  required:
  - expectedRevision
BrowserSessionEnrollment:
  description: Owner-only secret enrollment. The base64 JSON contains cookies, origins and Alfa headers; never persist this payload in the command journal or diagnostics. A single-use five-minute grant binds the current owner session, connection and generation. After an unknown result, inspect connection metadata before obtaining a new grant.
  type: object
  additionalProperties: false
  required: [grantId, expectedRevision, session]
  properties:
    grantId:
      $ref: ./money.yaml#/ID
    expectedRevision:
      $ref: ./money.yaml#/Revision
    session:
      type: string
      format: byte
      minLength: 4
      maxLength: 1398104
AuthorizationAttempt:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    connectionId:
      "$ref": "./money.yaml#/ID"
    expiresAt:
      "$ref": "./money.yaml#/Instant"
    state:
      type: string
      enum:
      - awaiting_owner
      - ready
      - completed
      - failed
    method:
      type: string
      enum: [oauth, browser_session]
    authorizationUrl:
      type: string
      format: uri
  required:
  - id
  - connectionId
  - expiresAt
  - state
  - method
  description: URL is returned only to the authenticated external-account owner; no
    credentials in shared chat or general connection responses.
ConnectionPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./connections.yaml#/Connection"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality

DeploymentBinding:
  type: object
  additionalProperties: false
  properties:
    provider:
      $ref: ./money.yaml#/Provider
    environment:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    adapterBuildDigest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    collectorImageDigest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    contractVersion:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    allowlistRevision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    nonSecretConfigRevision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    operatorPermissionRevision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
  required:
    - provider
    - environment
    - adapterBuildDigest
    - collectorImageDigest
    - contractVersion
    - allowlistRevision
    - nonSecretConfigRevision
    - operatorPermissionRevision
PendingDeploymentGate:
  type: object
  additionalProperties: false
  allOf:
    - anyOf:
        - required: [binding, admissionRevision]
        - not:
            anyOf:
              - required: [binding]
              - required: [admissionRevision]
              - required: [checkedAt]
  properties:
    status:
      type: string
      enum:
        - pending
    binding:
      $ref: ./connections.yaml#/DeploymentBinding
    admissionRevision:
      $ref: ./money.yaml#/Revision
    checkedAt:
      $ref: ./money.yaml#/Instant
    reasons:
      type: array
      items:
        type: string
        enum:
          - provider_pending
          - host_pending
          - provider_failed
          - host_failed
          - provider_revoked
          - host_revoked
      maxItems: 2
      uniqueItems: true
      minItems: 1
  required:
    - status
    - reasons
AdmittedDeploymentGate:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - admitted
    binding:
      $ref: ./connections.yaml#/DeploymentBinding
    admissionRevision:
      $ref: ./money.yaml#/Revision
    checkedAt:
      $ref: ./money.yaml#/Instant
    reasons:
      type: array
      items:
        type: string
        enum:
          - provider_pending
          - host_pending
          - provider_failed
          - host_failed
          - provider_revoked
          - host_revoked
      maxItems: 0
      uniqueItems: true
  required:
    - status
    - binding
    - admissionRevision
    - checkedAt
    - reasons
BlockedDeploymentGate:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - blocked
    binding:
      $ref: ./connections.yaml#/DeploymentBinding
    admissionRevision:
      $ref: ./money.yaml#/Revision
    checkedAt:
      $ref: ./money.yaml#/Instant
    reasons:
      type: array
      items:
        type: string
        enum:
          - provider_pending
          - host_pending
          - provider_failed
          - host_failed
          - provider_revoked
          - host_revoked
      maxItems: 2
      uniqueItems: true
      minItems: 1
  required:
    - status
    - binding
    - admissionRevision
    - checkedAt
    - reasons
DeploymentGate:
  oneOf:
    - $ref: ./connections.yaml#/PendingDeploymentGate
    - $ref: ./connections.yaml#/AdmittedDeploymentGate
    - $ref: ./connections.yaml#/BlockedDeploymentGate
  description: >-
    Server-owned D-43 admission, separate from authentication. Only the admission service combines
    provider and host evidence for the exact binding. Each state/evidence/binding change increases
    admissionRevision; an exact no-op preserves it. An absent admission has neither binding nor
    revision nor checkedAt. Jobs and results carry immutable binding/revision, checked before IO
    and in the source/posting/outbox transaction. Stale results remain in quarantine without a
    source record or financial effect; clients and AI cannot set admission.

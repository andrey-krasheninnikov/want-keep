"/rates":
  get:
    operationId: rates_list
    tags:
    - rates
    summary: rates list
    description: Reference observations preserve all source legs. Platform quotes require provider and applicable base amount with known fees/spread; otherwise quote_unavailable. Crypto history older than 365 days is valuation_unavailable; cached observations remain explicitly stale.
    parameters:
    - name: base
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Asset"
    - name: quote
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Asset"
    - name: date
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: provider
      in: query
      schema:
        "$ref": "../schemas/money.yaml#/Provider"
    - name: amount
      in: query
      schema:
        "$ref": "../schemas/money.yaml#/PositiveDecimal"
    - name: direction
      in: query
      description: Required with provider and amount. sell_base means selling base for quote; buy_base means buying base with quote.
      schema:
        type: string
        enum:
        - sell_base
        - buy_base
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/reports.yaml#/ValuationObservationPage"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"

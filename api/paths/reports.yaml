"/reports/valuation":
  get:
    operationId: reports_valuation
    tags:
    - reports
    summary: reports valuation
    description: Household valuation includes per-asset current owned, available and debt equivalents, household totals, pinned transaction-date components and separate reference revaluation. An unknown input makes its total unknown; source disagreement is reported in coverage even when a numeric value is known.
    parameters:
    - name: view
      in: query
      required: false
      schema:
        type: string
        enum:
        - household
    - name: asset
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Asset"
    - name: from
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: to
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    responses:
      '200':
        description: Success
        content:

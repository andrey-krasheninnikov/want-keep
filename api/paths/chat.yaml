---
"/attachments":
  post:
    operationId: attachments_upload
    tags:
    - attachments
    summary: attachments upload
    parameters:
    - "$ref": "../components.yaml#/parameters/CSRF"
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/chat.yaml#/Attachment"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
    description: Authenticated upload reserves uploadId, persists private evidence and queues validation.
      Repeated identical input recovers its result; conflicting content returns 409.
      Download, preview and analysis require accepted validation. Bytes never enter command records.
      A receipt/message command later determines the financial effect.
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            "$ref": "../schemas/chat.yaml#/AttachmentUpload"

      required: true
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    responses:
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
      '200':
        description: Accepted original only; family-authorized download with no-store, nosniff and attachment Content-Disposition.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
"/attachments/{attachmentId}/preview/{page}":
  get:
    operationId: attachments_preview
    tags: [attachments]
    summary: Read a safe raster preview of an accepted attachment
    parameters:
    - name: attachmentId
      in: path
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - name: page
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10
    responses:
      '200':
        description: Re-encoded PNG; family authorization, no-store, nosniff and restrictive CSP.
        content:
          image/png:
            schema:
              type: string
              format: binary
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':

"/receipts":
  post:
    operationId: receipts_create
    tags: [receipts]
    summary: Process or clarify one receipt payment
    x-command-type: receipts.create
    parameters:
    - { $ref: "../components.yaml#/parameters/IdempotencyKey" }
    - { $ref: "../components.yaml#/parameters/CSRF" }
    responses:
      '202':
        description: Command registered; recover the same command ID after an unknown result.
        content:
          application/json:
            schema: { $ref: '../schemas/commands.yaml#/CommandStatus' }
      '400': { $ref: '../components.yaml#/responses/Problem' }
      '401': { $ref: '../components.yaml#/responses/Problem' }
